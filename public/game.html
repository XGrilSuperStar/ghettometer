<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ghettometer</title>
<link rel="stylesheet" href="maplibre/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #eef0ff; -webkit-tap-highlight-color: transparent; }
  #map { position: absolute; inset: 0; }
  .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left { opacity: .45; }
  #money { position: absolute; z-index: 5; left: 14px; top: 14px; top: calc(14px + env(safe-area-inset-top)); display: flex; gap: 8px; align-items: center; padding: 9px 16px; border-radius: 18px; background: #0b1030; border: 2px solid #2b3a9a; box-shadow: 0 5px 0 #060a22, 0 0 18px rgba(80,110,255,.35); font-weight: 900; }
  #moneyV { font-size: 24px; color: #b6ff4d; text-shadow: 0 0 10px rgba(157,255,0,.7); display: inline-block; }
  #moneyV.bounce { animation: gb .6s cubic-bezier(.3,1.9,.4,1); }
  @keyframes gb { 0%{transform:scale(1)} 35%{transform:scale(1.5) rotate(-4deg)} 100%{transform:scale(1) rotate(0)} }
  .float { position: absolute; z-index: 30; font-weight: 900; font-size: 26px; pointer-events: none; animation: rise 1s ease-out forwards; text-shadow: 0 0 10px currentColor; }
  @keyframes rise { from { transform: translateY(0) scale(.8); opacity: 1 } to { transform: translateY(-70px) scale(1.4); opacity: 0 } }
  #me { position: absolute; z-index: 5; right: 14px; bottom: 24px; bottom: calc(24px + env(safe-area-inset-bottom)); width: 54px; height: 54px; border-radius: 50%; border: 2px solid #2b3a9a; background: #0b1030; box-shadow: 0 5px 0 #060a22, 0 0 18px rgba(80,110,255,.35); color: #8fe3ff; font-size: 24px; cursor: pointer; }
  #me:active { transform: translateY(3px); box-shadow: 0 2px 0 #060a22; }
  #gauge { position: absolute; z-index: 5; right: 14px; top: 14px; top: calc(14px + env(safe-area-inset-top)); width: 150px; text-align: center; padding: 8px 8px 8px; border-radius: 18px; background: #0b1030; border: 2px solid #2b3a9a; box-shadow: 0 5px 0 #060a22, 0 0 18px rgba(80,110,255,.35); }
  #gauge svg { display: block; margin: 0 auto -10px; }
  #gnum { display: block; font-size: 26px; font-weight: 900; line-height: 1; }
  #gauge span { font-size: 10px; font-weight: 800; letter-spacing: .12em; color: #8c97d8; }
  #hint { position: absolute; z-index: 5; left: 50%; top: 16px; transform: translateX(-50%); padding: 9px 16px; border-radius: 16px; background: #0b1030; border: 2px solid #2b3a9a; font-weight: 800; font-size: 14px; display: none; white-space: nowrap; }
  #sheet { position: absolute; z-index: 10; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(#10163f, #080b24); border-top: 2px solid #3a4cc9; border-radius: 24px 24px 0 0; box-shadow: 0 -10px 40px rgba(60,90,255,.35); transform: translateY(110%); transition: transform .35s cubic-bezier(.3,1.5,.5,1); max-width: 520px; margin: 0 auto; }
  #sheet.open { transform: none; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #name { font-weight: 900; font-size: 16px; line-height: 1.2; }
  #kind { font-size: 13px; font-weight: 800; color: #19f0c8; margin-top: 4px; text-transform: capitalize; }
  #places { font-size: 12px; color: #8c97d8; margin-top: 4px; line-height: 1.4; }
  #owner { font-weight: 900; font-size: 13px; padding: 4px 10px; border-radius: 12px; background: #0b1030; border: 1px solid #2b3a9a; white-space: nowrap; }
  .stats { display: flex; gap: 10px; margin: 14px 0; }
  .stat { flex: 1; text-align: center; background: #0b1030; border: 1px solid #25318a; border-radius: 16px; padding: 10px 4px; }
  .stat b { display: block; font-size: 24px; font-weight: 900; }
  .stat span { font-size: 11px; font-weight: 700; color: #8c97d8; text-transform: uppercase; letter-spacing: .06em; }
  .btn { flex: 1; font: inherit; font-weight: 900; font-size: 18px; padding: 15px 16px; border: 0; border-radius: 18px; cursor: pointer; color: #04121a; background: linear-gradient(#6ff5ff, #00c8e8); box-shadow: 0 6px 0 #007a96, 0 0 22px rgba(0,240,255,.45); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #007a96; }
  .btn:disabled { background: #2a3066; color: #8c97d8; box-shadow: 0 6px 0 #161a40; cursor: default; }
  .btn.gray { flex: 0 0 auto; background: #232a66; color: #cfd6ff; box-shadow: 0 6px 0 #121744; }
</style>
</head><body>
<div id="map"></div>
<div id="money"><span>💵</span><span id="moneyV">1000</span></div>
<div id="gauge"><svg viewBox="0 0 120 74" width="132"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#19f0c8"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff2e93"/></linearGradient></defs><path d="M10 64 A50 50 0 0 1 110 64" fill="none" stroke="#1a2260" stroke-width="12" stroke-linecap="round"/><path d="M10 64 A50 50 0 0 1 110 64" fill="none" stroke="url(#gg)" stroke-width="9" stroke-linecap="round"/><g id="needle" style="transform-origin:60px 64px;transition:transform .6s cubic-bezier(.3,1.6,.5,1);transform:rotate(-90deg)"><path d="M60 64 L60 22" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></g><circle cx="60" cy="64" r="6" fill="#fff"/></svg><b id="gnum">--</b><span>GHETTO METER</span></div>
<div id="hint"></div>
<button id="me" aria-label="My location">◎</button>
<div id="sheet">
  <div class="row"><div id="name">Block</div><div id="owner">For sale</div></div>
  <div id="kind"></div><div id="places"></div>
  <div class="stats">
    <div class="stat"><b id="sScore">--</b><span>Meter</span></div>
    <div class="stat"><b id="sPrice">--</b><span>Price</span></div>
    <div class="stat"><b id="sRent">--</b><span>Rent / day</span></div>
  </div>
  <div class="row"><button class="btn gray" id="close">Close</button><button class="btn" id="claim">Claim it</button></div>
</div>
<!-- Credits: map data (c) OpenStreetMap contributors, OpenFreeMap / OpenMapTiles. Blocks: US Census TIGERweb. Home values: Census ACS. -->
<script src="maplibre/maplibre-gl.js"></script>
<script src="meter_data.js?v=6"></script>
<script src="names.js?v=1"></script>
<script>
(function () {
  var D = window.METER || [], KEYS = window.METER_KEYS || [], N = D.length;
  var BLK = "https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/Tracts_Blocks/MapServer/2/query";
  var MINZ = 14, CYAN = "#00f0ff";
  var $ = function (id) { return document.getElementById(id); };
  var money = 1000, owned = {}, ownedB = {}, selBld = null;
  try { var sv = JSON.parse(localStorage.getItem("gm_game2") || "null"); if (sv) { money = sv.money; owned = sv.owned || {}; ownedB = sv.b || {}; } } catch (e) {}
  function save() { try { localStorage.setItem("gm_game2", JSON.stringify({ money: money, owned: owned, b: ownedB })); } catch (e) {} }
  $("moneyV").textContent = money;

  // fixed overall score (rank of the mean of all indicators) + spatial grid for fast lookup
  var GS = new Uint8Array(N), grid = {};
  (function () {
    var means = new Float64Array(N), i, k, o = [];
    for (i = 0; i < N; i++) { var s = 0; for (k = 0; k < KEYS.length; k++) s += D[i][3 + k]; means[i] = s / KEYS.length; o.push(i);
      var g = Math.floor(D[i][0] * 10) + "," + Math.floor(D[i][1] * 10); (grid[g] = grid[g] || []).push(i); }
    o.sort(function (a, b) { return means[a] - means[b]; });
    for (i = 0; i < N; i++) GS[o[i]] = Math.round(i / Math.max(N - 1, 1) * 100);
  })();
  function nearest(la, lo) {
    var cl = Math.cos(la * Math.PI / 180), gy = Math.floor(la * 10), gx = Math.floor(lo * 10);
    for (var r = 1; r <= 3; r++) {
      var best = -1, bd = 1e9;
      for (var y = gy - r; y <= gy + r; y++) for (var x = gx - r; x <= gx + r; x++) {
        var a = grid[y + "," + x]; if (!a) continue;
        for (var j = 0; j < a.length; j++) { var d = D[a[j]], dy = d[0] - la, dx = (d[1] - lo) * cl, dd = dx * dx + dy * dy; if (dd < bd) { bd = dd; best = a[j]; } }
      }
      if (best >= 0) return best;
    }
    return -1;
  }
  // nice = teal, middle = violet, worst = hot pink
  var RAMP = [[25, 240, 200], [122, 92, 255], [255, 46, 147]];
  function col(v) { var t = v / 50, i = Math.min(Math.floor(t), 1), f = t - i, a = RAMP[i], c = RAMP[i + 1];
    return "rgb(" + Math.round(a[0] + (c[0] - a[0]) * f) + "," + Math.round(a[1] + (c[1] - a[1]) * f) + "," + Math.round(a[2] + (c[2] - a[2]) * f) + ")"; }
  function priceOf(b) { var hv = b.idx >= 0 ? D[b.idx][26] : 0; return Math.max(20, Math.round(hv ? hv / 1000 : 150)); }
  function rentOf(b) { return Math.max(1, Math.round(priceOf(b) * 0.015 * 10) / 10); }
  function nm(i) { return (window.METER_NAMES && window.METER_NAMES[i]) || ""; }

  // game-style base map (Ingress dark + Pokemon Go simple): few colors, readable streets, few labels
  var KEEP = /^(label_city|label_city_capital|label_town|label_village|label_state|highway-name-major|highway-name-minor)$/;
  function gameStyle(style) {
    style.layers.forEach(function (l) {
      var id = l.id, t = l.type; l.paint = l.paint || {}; l.layout = l.layout || {};
      if (t === "background") l.paint["background-color"] = "#05070d";
      else if (id === "natural_earth") l.layout.visibility = "none";
      else if (t === "fill" && id === "building") l.paint["fill-color"] = "#18204a";
      else if (t === "fill" && /^water$/.test(id)) l.paint["fill-color"] = "#0a2a6b";
      else if (t === "fill" && /^(park|landcover_wood|landcover_grass|landuse_pitch)$/.test(id)) l.paint["fill-color"] = "#0b2f2c";
      else if (t === "fill") l.paint["fill-color"] = "#0a0f22";
      else if (t === "line" && /waterway/.test(id)) l.paint["line-color"] = "#0a2a6b";
      else if (t === "line" && /rail|boundary|aeroway|park_outline/.test(id)) l.layout.visibility = "none";
      else if (t === "line" && /_casing$/.test(id)) l.paint["line-color"] = "#05070d";
      else if (t === "line") l.paint["line-color"] = "#8a9bff";
      else if (t === "fill-extrusion") {
        l.paint["fill-extrusion-color"] = ["interpolate", ["linear"], ["get", "render_height"], 0, "#26338f", 40, "#3a4cc0", 150, "#6a80f0"];
        l.paint["fill-extrusion-opacity"] = 0.92; l.paint["fill-extrusion-vertical-gradient"] = true;
        l.paint["fill-extrusion-height"] = ["*", 1.6, ["get", "render_height"]];
        l.paint["fill-extrusion-base"] = ["*", 1.6, ["get", "render_min_height"]];
      }
      else if (t === "symbol") {
        if (KEEP.test(id)) { l.paint["text-color"] = "#c8d2ff"; l.paint["text-halo-color"] = "#05070d"; l.paint["text-halo-width"] = 1.6; }
        else l.layout.visibility = "none";
      }
    });
    return style;
  }

  var map, blocks = {}, count = 0, selKey = null, seq = 0, tmr = null, ready = false;
  var FALLBACK = [-118.2437, 34.0522];

  // ask for location immediately, before the map even loads; no short timeout so the permission box can be answered
  var gotLL = null, dot = null, fail = false;
  function placeDot(ll) {
    if (!dot) { var el = document.createElement("div"); el.style.cssText = "width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #00f0ff;box-shadow:0 0 14px 6px rgba(0,240,255,.7)"; dot = new maplibregl.Marker({ element: el }).setLngLat(ll).addTo(map); }
    else dot.setLngLat(ll);
  }
  function goTo(ll, instant) { placeDot(ll); map.easeTo({ center: ll, zoom: Math.max(map.getZoom(), 16.6), pitch: 62, duration: instant ? 0 : 900 }); }
  function askLoc(manual) {
    if (!navigator.geolocation) { fail = true; return; }
    navigator.geolocation.getCurrentPosition(function (p) {
      gotLL = [p.coords.longitude, p.coords.latitude]; hint("");
      if (ready) goTo(gotLL, !manual);
    }, function () { fail = true; if (ready) { hint("Location is blocked. Click the lock by the address bar and allow it."); setTimeout(function () { hint(""); }, 6000); } }, { timeout: 120000, maximumAge: 60000, enableHighAccuracy: false });
  }
  askLoc(false);
  fetch("https://tiles.openfreemap.org/styles/liberty").then(function (r) { return r.json(); }).then(function (style) {
    var startLL = gotLL;
    style = gameStyle(style);
    map = new maplibregl.Map({ container: "map", style: style, center: startLL || FALLBACK, zoom: 16.6, pitch: 62, bearing: -17, maxPitch: 70, maxZoom: 19.5, attributionControl: { compact: true } });
    window.__gmap = map;
    map.on("load", function () {
      map.addSource("gb", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      // block fill sits under the street lines so streets stay readable
      var firstRoad; map.getStyle().layers.some(function (l) { if (l.type === "line" && l["source-layer"] === "transportation") { firstRoad = l.id; return true; } });
      var bld3 = map.getLayer("building-3d") ? "building-3d" : undefined;
      map.addLayer({ id: "gb-fill", type: "fill", source: "gb", paint: { "fill-color": ["get", "col"], "fill-opacity": ["case", ["==", ["get", "own"], 1], 0.6, 0.5] } }, firstRoad);
      map.addLayer({ id: "gb-line", type: "line", source: "gb", paint: { "line-color": ["get", "col"], "line-width": ["case", ["==", ["get", "own"], 1], 2.5, 1.3], "line-opacity": 0.95 } }, bld3);
      map.addLayer({ id: "gb-glow", type: "line", source: "gb", filter: ["==", ["get", "own"], 1], paint: { "line-color": CYAN, "line-width": 14, "line-blur": 10, "line-opacity": 0.95 } }, bld3);
      map.addLayer({ id: "gb-own3d", type: "fill-extrusion", source: "gb", filter: ["==", ["get", "own"], 1], paint: { "fill-extrusion-color": CYAN, "fill-extrusion-height": 28, "fill-extrusion-base": 0, "fill-extrusion-opacity": 0.55 } }, bld3);
      map.addSource("ob", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      map.addLayer({ id: "ob-3d", type: "fill-extrusion", source: "ob", paint: { "fill-extrusion-color": CYAN, "fill-extrusion-height": ["*", 1.6, ["get", "h"]], "fill-extrusion-base": 0, "fill-extrusion-opacity": 0.85 } });
      map.addLayer({ id: "ob-glow", type: "line", source: "ob", paint: { "line-color": CYAN, "line-width": 10, "line-blur": 8, "line-opacity": 0.95 } });
      map.addSource("bs", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      map.addLayer({ id: "bs-3d", type: "fill-extrusion", source: "bs", paint: { "fill-extrusion-color": "#ffffff", "fill-extrusion-height": ["*", 1.6, ["get", "h"]], "fill-extrusion-base": ["*", 1.6, ["get", "m"]], "fill-extrusion-opacity": 0.6 } });
      map.addLayer({ id: "bs-line", type: "line", source: "bs", paint: { "line-color": "#ffffff", "line-width": 3.5 } });
      pushB();
      map.addLayer({ id: "gb-sel", type: "line", source: "gb", filter: ["==", ["get", "key"], ""], paint: { "line-color": "#ffffff", "line-width": 3.5 } });
      map.on("click", function (e) {
        var bf = map.queryRenderedFeatures(e.point, { layers: ["ob-3d", "building-3d"] });
        var f = map.queryRenderedFeatures(e.point, { layers: ["gb-fill", "gb-own3d"] });
        if (bf.length) selB(bf[0], e.lngLat, f.length ? f[0].properties.key : null);
        else if (f.length) select(f[0].properties.key, e.lngLat);
      });
      map.on("mouseenter", "gb-fill", function () { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", "gb-fill", function () { map.getCanvas().style.cursor = ""; });
      map.setLight({ anchor: "viewport", position: [1.4, 200, 50], intensity: 0.7, color: "#ffffff" });
      map.on("moveend", later); map.on("moveend", centerScore);
      ready = true; if (gotLL) goTo(gotLL, true); else if (fail) { hint("Location is blocked. Click the lock by the address bar and allow it."); setTimeout(function () { hint(""); }, 6000); } else hint("Allow location to start where you are"); later(); centerScore();
    });
  });

  // blocks
  function hint(t) { var h = $("hint"); h.textContent = t; h.style.display = t ? "block" : "none"; }
  function push() {
    var feats = [];
    Object.keys(blocks).forEach(function (k) { var b = blocks[k], mine = !!owned[k];
      feats.push({ type: "Feature", properties: { key: k, own: mine ? 1 : 0, col: mine ? CYAN : col(b.score) }, geometry: b.f.geometry }); });
    map.getSource("gb").setData({ type: "FeatureCollection", features: feats });
  }
  function later() { clearTimeout(tmr); tmr = setTimeout(load, 300); }
  function load() {
    if (!ready) return;
    if (map.getZoom() < MINZ) { hint("Zoom in to see the blocks"); return; }
    hint("");
    if (count > 6000) { Object.keys(blocks).forEach(function (k) { if (!owned[k]) { delete blocks[k]; count--; } }); }
    var b = map.getBounds(), my = ++seq;
    var q = BLK + "?where=1%3D1&geometry=" + [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(",") +
      "&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=GEOID,POP100,INTPTLAT,INTPTLON" +
      "&returnGeometry=true&outSR=4326&geometryPrecision=5&f=geojson&resultRecordCount=3000";
    fetch(q).then(function (r) { return r.json(); }).then(function (j) {
      if (my !== seq || !j || !j.features) return;
      j.features.forEach(function (f) {
        var p = f.properties || {}, key = p.GEOID; if (!key || blocks[key]) return;
        var idx = nearest(+p.INTPTLAT, +p.INTPTLON);
        blocks[key] = { f: f, idx: idx, score: idx >= 0 ? GS[idx] : 50 }; count++;
      });
      push();
    }).catch(function () { hint("Could not load blocks. Move the map to retry."); });
  }

  // individual buildings
  function ringsOf(g) { return g.type === "Polygon" ? [g.coordinates[0]] : g.coordinates.map(function (r) { return r[0]; }); }
  function centroid(g) { var r = ringsOf(g)[0], x = 0, y = 0; r.forEach(function (c) { x += c[0]; y += c[1]; }); return [x / r.length, y / r.length]; }
  function pushB() {
    var feats = Object.keys(ownedB).map(function (k) { var o = ownedB[k]; return { type: "Feature", properties: { key: k, h: o.h }, geometry: o.g }; });
    map.getSource("ob").setData({ type: "FeatureCollection", features: feats });
  }
  function selB(f, ll, blockKey) {
    var g = f.geometry, mh = +f.properties.render_min_height || 0;
    if (f.id !== undefined && f.id !== null) {
      try { var parts = map.querySourceFeatures("openmaptiles", { sourceLayer: "building" }).filter(function (x) { return x.id === f.id && x.geometry; });
        if (parts.length > 1) { var polys = []; parts.forEach(function (x) { (x.geometry.type === "Polygon" ? [x.geometry.coordinates] : x.geometry.coordinates).forEach(function (pl) { polys.push(pl); }); }); g = { type: "MultiPolygon", coordinates: polys }; } } catch (e) {}
    }
    var c = centroid(g), h = +f.properties.render_height || 8;
    var key = "b" + (f.id !== undefined && f.id !== null ? f.id : Math.round(c[1] * 1e5) + "," + Math.round(c[0] * 1e5));
    if (f.properties.key && ownedB[f.properties.key]) { key = f.properties.key; }
    var blk = blockKey && blocks[blockKey], idx = blk ? blk.idx : nearest(c[1], c[0]);
    var base = Math.max(20, Math.round((idx >= 0 && D[idx][26] ? D[idx][26] / 1000 : 150) * (0.6 + Math.min(h, 120) / 60)));
    var score = idx >= 0 ? GS[idx] : 50, own = !!ownedB[key];
    var near = placesFor({ f: { geometry: g } }, { lng: c[0], lat: c[1] }).filter(function (x) { return (x.ins || x.d < 12) && !/bus|stop|platform|stand|parking|bench/i.test(x.k); });
    var tract = idx >= 0 ? nm(idx).replace("Census Tract", "Tract").split(";").slice(0, 2).join(" · ") : "";
    selKey = null; selBld = { key: key, g: ownedB[key] ? ownedB[key].g : g, h: h, price: base, rent: Math.max(1, Math.round(base * 0.015 * 10) / 10), score: score };
    map.setFilter("gb-sel", ["==", ["get", "key"], ""]);
    map.getSource("bs").setData({ type: "Feature", properties: { h: h, m: mh }, geometry: selBld.g });
    $("name").textContent = near.length ? near[0].n : (h > 25 ? "Tall building" : "Building");
    $("kind").textContent = (near.length && near[0].k ? near[0].k + " · " : "") + "about " + Math.max(1, Math.round(h / 3.5)) + " floors";
    $("places").textContent = (near.length > 1 ? "Also here: " + near.slice(1, 4).map(function (x) { return x.n; }).join(", ") + "  ·  " : "") + tract;
    var o = $("owner"); o.textContent = own ? "You" : "For sale"; o.style.color = own ? CYAN : "#9aa3d6";
    $("sScore").textContent = score; $("sPrice").textContent = "$" + base; $("sRent").textContent = "$" + selBld.rent;
    var cl = $("claim");
    if (own) { cl.textContent = "Yours!"; cl.disabled = true; }
    else if (money < base) { cl.textContent = "Need $" + (base - money) + " more"; cl.disabled = true; }
    else { cl.textContent = "Buy it  $" + base; cl.disabled = false; }
    setGauge(score); $("sheet").classList.add("open");
  }
  function buyB() {
    var b = selBld; if (!b || ownedB[b.key] || money < b.price) return;
    var c = centroid(b.g), pr = map.project(c);
    ownedB[b.key] = { g: b.g, h: b.h }; setMoney(money - b.price, -b.price, { x: pr.x, y: pr.y }); pushB();
    $("owner").textContent = "You"; $("owner").style.color = CYAN; $("claim").textContent = "Yours!"; $("claim").disabled = true;
  }

  // sheet / claim
  var lastLL = null;
  function inRing(pt, ring) { var x = pt[0], y = pt[1], c = false; for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) { var xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
  function inGeom(pt, g) { var polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates; return polys.some(function (r) { return inRing(pt, r[0]); }); }
  function pretty(f) { var p = f.properties, k = (p.subclass || p.class || "").replace(/_/g, " "); return k; }
  function placesFor(b, ll) {
    var seen = {}, list = [];
    try {
      map.querySourceFeatures("openmaptiles", { sourceLayer: "poi" }).forEach(function (f) {
        var p = f.properties, n = p.name || p["name:latin"]; if (!n || !f.geometry || f.geometry.type !== "Point") return;
        var c = f.geometry.coordinates, id = n + c[0].toFixed(5); if (seen[id]) return; seen[id] = 1;
        var dx = (c[0] - ll.lng) * Math.cos(ll.lat * Math.PI / 180) * 111320, dy = (c[1] - ll.lat) * 111320, d = Math.sqrt(dx * dx + dy * dy);
        var ins = inGeom(c, b.f.geometry); if (d < 60 || ins) list.push({ n: n, k: pretty(f), d: d, ins: ins });
      });
    } catch (e) {}
    list.sort(function (a, b) { return a.d - b.d; });
    return list;
  }
  function select(key, ll) {
    if (ll) lastLL = ll; else if (!lastLL) { var pp = blocks[key] && blocks[key].f.properties; lastLL = pp ? { lng: +pp.INTPTLON, lat: +pp.INTPTLAT } : map.getCenter(); }
    selKey = key; selBld = null; map.getSource("bs").setData({ type: "FeatureCollection", features: [] }); var b = blocks[key]; if (!b) return;
    map.setFilter("gb-sel", ["==", ["get", "key"], key]);
    var mine = !!owned[key], o = $("owner");
    var tract = (b.idx >= 0 ? nm(b.idx).replace("Census Tract", "Tract").split(";").slice(0, 2).join(" · ") : "Block") + "  ·  Block " + key.slice(-4);
    var pl = placesFor(b, lastLL);
    if (pl.length) { $("name").textContent = pl[0].n; $("kind").textContent = pl[0].k || "place"; $("places").textContent = (pl.length > 1 ? "Also here: " + pl.slice(1, 5).map(function (x) { return x.n; }).join(", ") + "  ·  " : "") + tract; }
    else { $("name").textContent = "Unnamed block"; $("kind").textContent = ""; $("places").textContent = tract; }
    o.textContent = mine ? "You" : "For sale"; o.style.color = mine ? CYAN : "#9aa3d6";
    $("sScore").textContent = b.score; $("sPrice").textContent = "$" + priceOf(b); $("sRent").textContent = "$" + rentOf(b);
    var c = $("claim");
    if (mine) { c.textContent = "Yours!"; c.disabled = true; }
    else if (money < priceOf(b)) { c.textContent = "Need $" + (priceOf(b) - money) + " more"; c.disabled = true; }
    else { c.textContent = "Claim it  $" + priceOf(b); c.disabled = false; }
    setGauge(b.score); $("sheet").classList.add("open");
  }
  window.__select = select;
  $("close").onclick = function () { selBld = null; map.getSource("bs").setData({ type: "FeatureCollection", features: [] }); $("sheet").classList.remove("open"); selKey = null; map.setFilter("gb-sel", ["==", ["get", "key"], ""]); centerScore(); };
  function setMoney(v, delta, at) {
    money = v; $("moneyV").textContent = money; save();
    var m = $("moneyV"); m.classList.remove("bounce"); void m.offsetWidth; m.classList.add("bounce");
    if (delta) { var f = document.createElement("div"); f.className = "float"; f.textContent = (delta > 0 ? "+" : "-") + "$" + Math.abs(delta);
      f.style.color = delta > 0 ? "#b6ff4d" : "#ff6b8a"; f.style.left = ((at && at.x) || innerWidth / 2) + "px"; f.style.top = ((at && at.y) || innerHeight / 2) + "px";
      document.body.appendChild(f); setTimeout(function () { f.remove(); }, 1000); }
  }
  $("claim").onclick = function () {
    if (selBld) { buyB(); return; }
    var b = blocks[selKey]; if (!b || owned[selKey] || money < priceOf(b)) return;
    var cost = priceOf(b), p = b.f.properties, pr = map.project([+p.INTPTLON, +p.INTPTLAT]);
    owned[selKey] = 1; setMoney(money - cost, -cost, { x: pr.x, y: pr.y }); push(); select(selKey);
  };

  function setGauge(v) { $("gnum").textContent = v === null ? "--" : v; $("needle").style.transform = "rotate(" + (v === null ? -90 : -90 + v * 1.8) + "deg)"; }
  function centerScore() { if (selKey) return; var c = map.getCenter(), i = nearest(c.lat, c.lng); setGauge(i >= 0 ? GS[i] : null); }
  // my location dot
  $("me").onclick = function () { if (gotLL) goTo(gotLL, false); else askLoc(true); };
})();
</script>
